# Local or single-server deployment: Postgres, migrations, the app. Copy .env.example to .env first.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}", POSTGRES_DB: networkmanager }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  migrate:
    image: postgres:16
    depends_on: { db: { condition: service_healthy } }
    volumes: [./supabase/migrations:/app/supabase/migrations:ro, ./scripts:/app/scripts:ro]
    working_dir: /app
    environment: { DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/networkmanager" }
    entrypoint: ["bash", "scripts/migrate.sh"]
  app:
    build: .
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/networkmanager"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      SMTP_URL: "${SMTP_URL:-}"
      MAIL_FROM: "${MAIL_FROM:-Network Manager <no-reply@localhost>}"
      CRON_SECRET: "${CRON_SECRET:?set CRON_SECRET (16+ characters) in .env}"
    restart: unless-stopped
volumes: { dbdata: {} }
